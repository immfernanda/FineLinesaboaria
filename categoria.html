<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fine Line · Catálogo</title>
  <meta name="theme-color" content="#F5EFFA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="categoria">

  <svg class="fio" aria-hidden="true"><path id="fio-path" /></svg>

  <main>
    <section class="cat-topo">
      <nav class="abas" aria-label="Categorias" id="abas"></nav>
      <h1 id="cat-titulo"></h1>
      <p id="cat-resumo"></p>
      <div class="tamanhos" role="radiogroup" aria-label="Tamanho" id="seletor-tamanho"></div>
    </section>

    <section class="secao secao--produtos">
      <div class="grade-produtos" id="grade-produtos"></div>
    </section>

    <section class="detalhes" id="detalhes" hidden>
      <div class="secao__cabeca revelar">
        <h2>Pensado nos <span class="destaque">detalhes</span></h2>
      </div>
      <div class="detalhes__corpo">
        <ul class="detalhes__lista detalhes__lista--esq"></ul>
        <div class="detalhes__vitrine revelar">
          <div class="trio" id="detalhes-trio"></div>
        </div>
        <ul class="detalhes__lista detalhes__lista--dir"></ul>
      </div>
    </section>

    <section class="secao secao--estreita" id="como-usar" hidden>
      <div class="secao__cabeca revelar">
        <h2>Como usar</h2>
      </div>
      <ol class="passos" id="passos"></ol>
      <p class="aviso revelar" id="aviso"></p>
    </section>

    <section class="comprar" id="comprar"></section>
  </main>

  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
